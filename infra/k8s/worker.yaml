apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: nexusrag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: nexusrag/backend:latest
          command: ["rq", "worker", "document_ingestion", "--url", "redis://redis:6379/0"]
          volumeMounts:
            - name: uploads-shared
              mountPath: /app/storage/uploads
          env:
            - name: MONGODB_URI
              value: mongodb://mongodb:27017
            - name: MONGODB_DB
              value: nexusrag
            - name: QDRANT_URL
              value: http://qdrant:6333
            - name: QDRANT_COLLECTION
              value: workspace_chunks
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: TASK_QUEUE_NAME
              value: document_ingestion
            - name: FILE_STORAGE_DIR
              value: storage/uploads
      volumes:
        - name: uploads-shared
          persistentVolumeClaim:
            claimName: uploads-shared-pvc
